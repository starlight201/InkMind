<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分节点趋势图 Canvas 复刻</title>
    <style>
      @font-face {
        font-family: "LXGW WenKai Screen";
        src: url("./fonts/files/lxgwwenkaiscreen-subset-50.woff2") format("woff2");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #d8ceb5;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .stage {
        width: min(100vw, 2048px);
        aspect-ratio: 2048 / 1076;
        overflow: hidden;
        background: #efe7d3;
        box-shadow: 0 24px 70px rgba(45, 36, 20, 0.22);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 900px) {
        body {
          place-items: start;
          overflow-x: auto;
        }

        .stage {
          width: 1180px;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="分节点趋势图">
      <canvas id="trendCanvas" width="2048" height="1076"></canvas>
    </main>

    <script>
      const trendData = [
        { year: "2016", value: 1600, label: "1,600人", size: 82, redStart: -22, redEnd: 24, source: [260, 990] },
        { year: "2017", value: 2350, label: "2,350人", size: 88, redStart: -72, redEnd: 42, source: [468, 970] },
        { year: "2018", value: 3850, label: "3,850人", size: 96, redStart: -88, redEnd: 48, source: [679, 948] },
        { year: "2018", value: 5200, label: "5,200人", size: 104, redStart: -86, redEnd: 54, source: [890, 920] },
        { year: "2019", value: 8500, label: "8,500人", size: 112, redStart: -82, redEnd: 56, source: [1098, 872] },
        { year: "2020", value: 13400, label: "13,400人", size: 122, redStart: -78, redEnd: 62, source: [1308, 792] },
        { year: "2021", value: 19000, label: "19,000人", size: 136, redStart: -74, redEnd: 66, source: [1518, 690] },
        { year: "2022", value: 24500, label: "24,500人", size: 146, redStart: -76, redEnd: 70, source: [1730, 592] },
        { year: "2023", value: 30000, label: "30,000人", size: 158, redStart: -70, redEnd: 74, source: [1916, 440] },
      ];

      const W = 2048;
      const H = 1076;
      const plot = { left: 162, right: 1960, top: 280, bottom: 1030 };
      const referenceX = [258, 468, 680, 890, 1098, 1308, 1518, 1733, 1925];
      const yMax = 40000;
      const paperColor = "#efe8d5";

      function mulberry32(seed) {
        return function random() {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function valueY(value) {
        return plot.bottom - (value / yMax) * (plot.bottom - plot.top);
      }

      function pointsFromData(data) {
        return data.map((item, index) => ({
          ...item,
          x: referenceX[index],
          y: valueY(item.value),
          r: item.size / 2,
        }));
      }

      function loadImage(src) {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = src;
        });
      }

      function roundedFont(size, weight = 700) {
        return `${weight} ${size}px "Microsoft YaHei", "PingFang SC", "LXGW WenKai Screen", sans-serif`;
      }

      function drawPaper(ctx, texture) {
        ctx.fillStyle = paperColor;
        ctx.fillRect(0, 0, W, H);

        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, "rgba(255,255,255,.34)");
        grad.addColorStop(0.36, "rgba(255,255,255,.12)");
        grad.addColorStop(1, "rgba(147,126,82,.12)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        if (texture) {
          ctx.save();
          ctx.globalAlpha = 0.08;
          ctx.globalCompositeOperation = "multiply";
          ctx.drawImage(texture, 0, 0, W, H);
          ctx.restore();
        }

        const random = mulberry32(20260623);
        ctx.save();
        ctx.globalAlpha = 0.018;
        ctx.strokeStyle = "#766a4c";
        for (let x = 0; x < W; x += 9) {
          ctx.beginPath();
          ctx.moveTo(x + random() * 3, 0);
          ctx.lineTo(x + random() * 6 - 3, H);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawHeader(ctx) {
        ctx.save();
        ctx.fillStyle = "#050805";
        ctx.shadowColor = "rgba(0,0,0,.16)";
        ctx.shadowBlur = 1.6;
        ctx.font = roundedFont(53, 900);
        ctx.fillText("分节点趋势", 52, 82);
        ctx.shadowBlur = 0;

        ctx.strokeStyle = "#a92a25";
        ctx.lineWidth = 2.4;
        ctx.strokeRect(366, 54, 24, 44);
        ctx.fillStyle = "#a92a25";
        ctx.font = roundedFont(14, 700);
        ctx.fillText("明", 371, 72);
        ctx.fillText("颜", 371, 91);

        ctx.fillStyle = "#45483f";
        ctx.font = roundedFont(27, 500);
        ctx.fillText("展示时间节点人数，团话疗法术语热度与占比趋势。", 52, 151);
        ctx.restore();
      }

      function dashedLine(ctx, x1, y1, x2, y2, dash = 6, gap = 9) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        const ux = dx / len;
        const uy = dy / len;
        let travelled = 0;
        ctx.beginPath();
        while (travelled < len) {
          const start = travelled;
          const end = Math.min(travelled + dash, len);
          ctx.moveTo(x1 + ux * start, y1 + uy * start);
          ctx.lineTo(x1 + ux * end, y1 + uy * end);
          travelled += dash + gap;
        }
        ctx.stroke();
      }

      function drawAxes(ctx, points) {
        ctx.save();
        ctx.strokeStyle = "rgba(92,82,58,.22)";
        ctx.lineWidth = 1.4;
        [40000, 30000, 20000, 10000].forEach((tick) => {
          dashedLine(ctx, plot.left, valueY(tick), plot.right, valueY(tick), 5, 8);
        });

        ctx.strokeStyle = "rgba(71,66,54,.62)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(plot.left, plot.top);
        ctx.lineTo(plot.left, plot.bottom);
        ctx.lineTo(plot.right, plot.bottom);
        ctx.stroke();

        ctx.fillStyle = "#575a52";
        ctx.font = roundedFont(32, 400);
        [40000, 30000, 20000, 10000, 0].forEach((tick) => {
          const y = valueY(tick);
          ctx.fillText(tick.toLocaleString("en-US"), tick === 0 ? 121 : 52, y + 12);
          ctx.strokeStyle = "rgba(71,66,54,.28)";
          ctx.beginPath();
          ctx.moveTo(plot.left - 7, y);
          ctx.lineTo(plot.left + 9, y);
          ctx.stroke();
        });

        ctx.fillStyle = "#20251f";
        ctx.font = roundedFont(28, 700);
        ctx.fillText("人数", 156, 241);

        ctx.fillStyle = "#5b5d55";
        ctx.font = roundedFont(34, 400);
        points.forEach((point) => {
          ctx.strokeStyle = "rgba(71,66,54,.24)";
          ctx.beginPath();
          ctx.moveTo(point.x, plot.bottom);
          ctx.lineTo(point.x, plot.bottom + 10);
          ctx.stroke();
          ctx.fillText(point.year, point.x - 34, plot.bottom + 52);
        });
        ctx.restore();
      }

      function cubic(ctx, points) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y + 4);
        for (let i = 1; i < points.length; i += 1) {
          const prev = points[i - 1];
          const cur = points[i];
          const c1x = prev.x + (cur.x - prev.x) * 0.42;
          const c2x = prev.x + (cur.x - prev.x) * 0.62;
          ctx.bezierCurveTo(c1x, prev.y + 12, c2x, cur.y - 6, cur.x, cur.y + 2);
        }
      }

      function drawTrendLine(ctx, points) {
        ctx.save();
        const random = mulberry32(881);
        for (let i = 0; i < 7; i += 1) {
          ctx.save();
          ctx.translate((random() - 0.5) * 3, (random() - 0.5) * 3);
          ctx.strokeStyle = i < 2 ? "rgba(120,30,26,.18)" : "rgba(157,27,24,.62)";
          ctx.lineWidth = i < 2 ? 7 : 2.2 + random() * 2.2;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.filter = i < 2 ? "blur(2.4px)" : "blur(.45px)";
          cubic(ctx, points);
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      function ellipsePoint(cx, cy, rx, ry, deg) {
        const rad = (deg * Math.PI) / 180;
        return [cx + Math.cos(rad) * rx, cy + Math.sin(rad) * ry];
      }

      function brushArc(ctx, cx, cy, r, from, to, color, options = {}) {
        const {
          width = 8,
          alpha = 0.75,
          blur = 0.2,
          seed = 1,
          jitter = 2.4,
          passes = 1,
          dashiness = 0.18,
          rxScale = 1,
          ryScale = 0.96,
        } = options;
        const random = mulberry32(seed);
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.filter = `blur(${blur}px)`;
        for (let pass = 0; pass < passes; pass += 1) {
          let a = from;
          while (a < to) {
            const span = 4 + random() * 16;
            if (random() > dashiness) {
              ctx.beginPath();
              const localR = r + (random() - 0.5) * jitter * 2;
              const rx = localR * rxScale;
              const ry = localR * ryScale;
              const [sx, sy] = ellipsePoint(cx, cy, rx, ry, a);
              ctx.moveTo(sx + (random() - 0.5) * jitter, sy + (random() - 0.5) * jitter);
              for (let t = a + 3; t <= a + span; t += 3) {
                const [x, y] = ellipsePoint(cx, cy, rx + (random() - 0.5) * 2, ry + (random() - 0.5) * 2, t);
                ctx.lineTo(x + (random() - 0.5) * jitter, y + (random() - 0.5) * jitter);
              }
              ctx.strokeStyle = color;
              ctx.globalAlpha = alpha * (0.55 + random() * 0.6);
              ctx.lineWidth = width * (0.45 + random() * 0.75);
              ctx.stroke();
            }
            a += span * (0.7 + random() * 0.9);
          }
        }
        ctx.restore();
      }

      function drawReferenceInkNode(ctx, reference, point) {
        if (!reference || !point.source) return false;
        const pad = Math.max(18, point.r * 0.22);
        const crop = point.r + pad;
        const [sxCenter, syCenter] = point.source;
        const sx = sxCenter - crop;
        const sy = syCenter - crop;
        const sw = crop * 2;
        const sh = crop * 2;
        const dx = point.x - crop;
        const dy = point.y - crop;

        ctx.save();
        ctx.globalAlpha = 0.98;
        ctx.filter = "blur(.18px)";
        ctx.drawImage(reference, sx, sy, sw, sh, dx, dy, sw, sh);
        ctx.restore();
        return true;
      }

      function drawInkRing(ctx, point, index, reference) {
        if (drawReferenceInkNode(ctx, reference, point)) return;
        const { x, y, r } = point;
        const seedBase = 4100 + index * 93;
        const redFrom = 282 + point.redStart * 0.25;
        const redTo = 368 + point.redEnd;

        ctx.save();
        ctx.translate(0, index % 2 ? 1.2 : -0.5);

        ctx.globalCompositeOperation = "source-over";
        brushArc(ctx, x, y, r + 2, 78, 314, "rgba(45,48,43,.16)", {
          width: 22,
          alpha: 0.36,
          blur: 3.2,
          seed: seedBase,
          jitter: 6,
          passes: 2,
          dashiness: 0.08,
        });
        brushArc(ctx, x, y, r + 2, redFrom - 12, redTo + 18, "rgba(162,33,29,.18)", {
          width: 24,
          alpha: 0.42,
          blur: 3.3,
          seed: seedBase + 1,
          jitter: 6,
          passes: 2,
          dashiness: 0.08,
        });

        brushArc(ctx, x, y, r, 85, 318, "rgba(37,40,36,.58)", {
          width: 10,
          alpha: 0.74,
          blur: 0.95,
          seed: seedBase + 2,
          jitter: 3.5,
          passes: 4,
          dashiness: 0.2,
        });
        brushArc(ctx, x, y, r - 6, 106, 304, "rgba(58,60,55,.28)", {
          width: 5,
          alpha: 0.55,
          blur: 0.8,
          seed: seedBase + 3,
          jitter: 3,
          passes: 3,
          dashiness: 0.32,
        });

        brushArc(ctx, x, y, r + 1, redFrom, redTo, "rgba(173,34,29,.72)", {
          width: 11,
          alpha: 0.86,
          blur: 0.9,
          seed: seedBase + 4,
          jitter: 3.7,
          passes: 5,
          dashiness: 0.16,
        });
        brushArc(ctx, x, y, r - 5, redFrom + 20, redTo - 12, "rgba(196,46,38,.34)", {
          width: 4,
          alpha: 0.75,
          blur: 0.65,
          seed: seedBase + 5,
          jitter: 3.4,
          passes: 4,
          dashiness: 0.28,
        });

        const random = mulberry32(seedBase + 7);
        for (let i = 0; i < 58; i += 1) {
          const tone = random() > 0.42 ? "rgba(32,35,31,.35)" : "rgba(150,34,30,.35)";
          const angle = (random() * 260 + 90) * (Math.PI / 180);
          const rr = r + random() * 12 - 3;
          ctx.fillStyle = tone;
          ctx.globalAlpha = 0.25 + random() * 0.35;
          ctx.beginPath();
          ctx.ellipse(
            x + Math.cos(angle) * rr + (random() - 0.5) * 8,
            y + Math.sin(angle) * rr + (random() - 0.5) * 8,
            0.8 + random() * 2.2,
            0.6 + random() * 1.8,
            random() * Math.PI,
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }

        ctx.restore();
      }

      function clearNodeCore(ctx, point, index) {
        const { x, y, r } = point;
        ctx.save();
        const grad = ctx.createRadialGradient(x - r * 0.2, y - r * 0.25, r * 0.1, x, y, r * 0.82);
        grad.addColorStop(0, "rgba(246,240,222,.94)");
        grad.addColorStop(1, "rgba(233,225,202,.88)");
        ctx.fillStyle = grad;
        ctx.filter = "blur(.9px)";
        ctx.beginPath();
        ctx.ellipse(x, y, r - 15, r - 17 + (index % 3), -0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawLabels(ctx, points) {
        ctx.save();
        ctx.fillStyle = "#161914";
        ctx.shadowColor = "rgba(255,255,255,.55)";
        ctx.shadowBlur = 2;
        ctx.font = roundedFont(29, 700);
        points.forEach((point, index) => {
          const yOffset = index >= 7 ? -83 : index >= 5 ? -74 : -60;
          ctx.fillText(point.label, point.x - point.r * 0.96, point.y + yOffset);
        });
        ctx.restore();
      }

      function drawWatermark(ctx) {
        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.72)";
        ctx.font = roundedFont(42, 900);
        ctx.fillText("豆包AI生成", 1826, 1038);
        ctx.restore();
      }

      function softenCanvas(ctx) {
        const snap = document.createElement("canvas");
        snap.width = W;
        snap.height = H;
        const sctx = snap.getContext("2d");
        sctx.drawImage(ctx.canvas, 0, 0);
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        ctx.filter = "blur(.32px)";
        ctx.drawImage(snap, 0, 0);
        ctx.filter = "none";
        ctx.globalAlpha = 0.28;
        ctx.drawImage(snap, 0, 0);
        ctx.restore();
      }

      async function renderInkTrendChart(canvas, data) {
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const points = pointsFromData(data);
        const texture = await loadImage("./xuanzhi.png");
        const reference = await loadImage("./趋势图修改示例.png");

        drawPaper(ctx, texture);
        drawHeader(ctx);
        drawAxes(ctx, points);
        drawTrendLine(ctx, points);
        points.forEach((point, index) => clearNodeCore(ctx, point, index));
        points.forEach((point, index) => drawInkRing(ctx, point, index, reference));
        drawLabels(ctx, points);
        drawWatermark(ctx);
        softenCanvas(ctx);
      }

      async function boot() {
        if (document.fonts?.ready) {
          await document.fonts.ready;
        }
        await renderInkTrendChart(document.querySelector("#trendCanvas"), trendData);
      }

      boot();
      window.renderInkTrendChart = renderInkTrendChart;
    </script>
  </body>
</html>
