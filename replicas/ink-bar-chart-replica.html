<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2025 年四类心理问题患病率 - 水墨柱状图复刻</title>
    <style>
      :root {
        --ink: #1f2927;
        --muted: #68716e;
        --grid: rgba(108, 99, 78, 0.22);
        --paper: #f9f3df;
        --card: rgba(255, 253, 245, 0.88);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(247, 237, 205, 0.44), rgba(247, 237, 205, 0.44)),
          url("../宣纸.png") center / cover,
          #efe3bd;
        font-family:
          "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial,
          sans-serif;
        color: var(--ink);
      }

      .phone-stage {
        width: min(100vw, 940px);
        padding: 40px 0 56px;
        overflow: hidden;
      }

      .chart-card {
        position: relative;
        width: 940px;
        max-width: 100vw;
        height: 940px;
        padding: 56px 0 40px;
        border-radius: 0 24px 24px 0;
        background:
          radial-gradient(circle at 55% 42%, rgba(255, 250, 227, 0.58), transparent 42%),
          linear-gradient(90deg, rgba(255, 255, 250, 0.96), rgba(255, 252, 237, 0.86));
        box-shadow:
          0 18px 42px rgba(91, 75, 49, 0.14),
          inset 0 0 0 1px rgba(126, 112, 86, 0.08);
      }

      .chart-card::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.26;
        mix-blend-mode: multiply;
        background-image:
          repeating-linear-gradient(0deg, transparent 0 8px, rgba(94, 75, 41, 0.035) 9px),
          repeating-linear-gradient(90deg, transparent 0 11px, rgba(94, 75, 41, 0.025) 12px);
        border-radius: inherit;
      }

      .chart-copy {
        position: relative;
        z-index: 1;
        padding-left: 0;
      }

      h1 {
        margin: 0 0 22px;
        font-size: 50px;
        line-height: 1.08;
        font-weight: 900;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 30px;
        line-height: 1.45;
        font-weight: 500;
      }

      .chart-wrap {
        position: relative;
        z-index: 1;
        margin-top: 46px;
        width: 900px;
        height: 640px;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .axis-label {
        fill: #1f2927;
        font-size: 31px;
        font-weight: 900;
      }

      .x-label {
        fill: #5f6965;
        font-size: 28px;
        font-weight: 500;
      }

      .value-label {
        fill: #293330;
        font-size: 27px;
        font-weight: 800;
      }

      .grid {
        stroke: var(--grid);
        stroke-width: 1.4;
        stroke-dasharray: 8 9;
      }

      .brush-hit {
        cursor: pointer;
        fill: transparent;
      }

      .tooltip {
        position: absolute;
        left: 530px;
        top: 375px;
        width: 172px;
        min-height: 142px;
        padding: 25px 25px 22px;
        border: 1px solid rgba(107, 99, 78, 0.14);
        border-radius: 16px;
        background: rgba(255, 255, 253, 0.96);
        box-shadow: 0 13px 28px rgba(69, 60, 43, 0.16);
        color: #1f2927;
        font-size: 30px;
        line-height: 1.42;
        font-weight: 900;
        opacity: 1;
        transform: translateZ(0);
        transition: left 180ms ease, top 180ms ease, opacity 160ms ease;
      }

      .tooltip.is-hidden {
        opacity: 0;
      }

      .tooltip span {
        display: block;
      }

      @media (max-width: 720px) {
        body {
          place-items: start center;
        }

        .phone-stage {
          padding: 0;
        }

        .chart-card {
          width: 100vw;
          height: auto;
          min-height: 790px;
          padding: 40px 0 26px;
          border-radius: 0 18px 18px 0;
        }

        h1 {
          font-size: clamp(34px, 8vw, 50px);
        }

        p {
          font-size: clamp(20px, 4.8vw, 30px);
        }

        .chart-wrap {
          width: 96vw;
          height: 560px;
          margin-top: 32px;
        }

        .tooltip {
          left: 56vw;
          top: 355px;
          width: 148px;
          min-height: 120px;
          padding: 19px 21px;
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone-stage">
      <section class="chart-card" aria-labelledby="chart-title">
        <div class="chart-copy">
          <h1 id="chart-title">2025 年四类心理问题患病率</h1>
          <p>四类问题可能重叠，患病率不做合计，点击后聚焦对应趋势。</p>
        </div>

        <div class="chart-wrap">
          <svg viewBox="0 0 900 640" role="img" aria-label="2025 年四类心理问题患病率，学习压力 71%，自我否认 35%，抑郁 37%，焦虑 34%">
            <defs>
              <filter id="roughInk" x="-8%" y="-40%" width="116%" height="180%">
                <feTurbulence baseFrequency="0.022 0.18" numOctaves="3" seed="7" type="fractalNoise" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
                <feGaussianBlur stdDeviation="0.22" />
              </filter>

              <filter id="softShadow" x="-15%" y="-80%" width="130%" height="260%">
                <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#4c3e29" flood-opacity="0.14" />
              </filter>

              <linearGradient id="stress" x1="0" x2="1">
                <stop offset="0" stop-color="#111411" stop-opacity="0.98" />
                <stop offset="0.18" stop-color="#302a20" stop-opacity="0.95" />
                <stop offset="0.58" stop-color="#8c7658" stop-opacity="0.66" />
                <stop offset="0.86" stop-color="#d7cab0" stop-opacity="0.28" />
                <stop offset="1" stop-color="#f7f1dd" stop-opacity="0.05" />
              </linearGradient>

              <linearGradient id="denial" x1="0" x2="1">
                <stop offset="0" stop-color="#292235" stop-opacity="0.96" />
                <stop offset="0.2" stop-color="#55416b" stop-opacity="0.88" />
                <stop offset="0.62" stop-color="#8e78a6" stop-opacity="0.58" />
                <stop offset="1" stop-color="#eadff0" stop-opacity="0.1" />
              </linearGradient>

              <linearGradient id="depress" x1="0" x2="1">
                <stop offset="0" stop-color="#172a25" stop-opacity="0.96" />
                <stop offset="0.23" stop-color="#355b4e" stop-opacity="0.86" />
                <stop offset="0.62" stop-color="#7aa290" stop-opacity="0.54" />
                <stop offset="1" stop-color="#e3eee6" stop-opacity="0.1" />
              </linearGradient>

              <linearGradient id="anxiety" x1="0" x2="1">
                <stop offset="0" stop-color="#8f251f" stop-opacity="0.95" />
                <stop offset="0.24" stop-color="#b94d43" stop-opacity="0.84" />
                <stop offset="0.68" stop-color="#da9081" stop-opacity="0.52" />
                <stop offset="1" stop-color="#f3ded8" stop-opacity="0.1" />
              </linearGradient>

              <path id="stroke-shape" d="M0,18 C48,-8 154,5 257,7 C378,9 487,-1 585,4 C615,7 637,12 648,19 C623,29 579,28 533,28 C405,29 263,26 135,30 C77,32 30,36 0,25 C-10,23 -10,20 0,18 Z" />
            </defs>

            <g transform="translate(166 30)">
              <line class="grid" x1="0" y1="0" x2="0" y2="492" />
              <line class="grid" x1="164" y1="0" x2="164" y2="492" />
              <line class="grid" x1="328" y1="0" x2="328" y2="492" />
              <line class="grid" x1="492" y1="0" x2="492" y2="492" />
              <line class="grid" x1="656" y1="0" x2="656" y2="492" />
            </g>

            <g class="labels">
              <text class="axis-label" x="34" y="120">学习压力</text>
              <text class="axis-label" x="34" y="267">自我否认</text>
              <text class="axis-label" x="95" y="414">抑郁</text>
              <text class="axis-label" x="95" y="560">焦虑</text>

              <text class="x-label" x="145" y="616">0%</text>
              <text class="x-label" x="310" y="616">20%</text>
              <text class="x-label" x="474" y="616">40%</text>
              <text class="x-label" x="637" y="616">60%</text>
              <text class="x-label" x="801" y="616">80%</text>
            </g>

            <g class="bars" transform="translate(166 0)" filter="url(#softShadow)">
              <g class="bar" data-name="学习压力" data-value="71" data-left="617" data-top="92">
                <rect x="-5" y="83" width="582" height="46" rx="12" fill="rgba(255,252,239,.28)" stroke="rgba(108,96,74,.07)" />
                <g transform="translate(0 81) scale(.89 1.32)">
                  <use href="#stroke-shape" fill="url(#stress)" filter="url(#roughInk)" />
                </g>
                <ellipse cx="18" cy="111" rx="28" ry="24" fill="#101411" opacity=".96" filter="url(#roughInk)" />
                <path d="M28 97 C164 88 318 111 520 98" stroke="#2d261d" stroke-width="8" stroke-linecap="round" opacity=".25" filter="url(#roughInk)" />
                <text class="value-label" x="593" y="116">71%</text>
                <rect class="brush-hit" x="-20" y="74" width="635" height="64" />
              </g>

              <g class="bar" data-name="自我否认" data-value="35" data-left="530" data-top="375">
                <g transform="translate(0 229) scale(.46 1.28)">
                  <use href="#stroke-shape" fill="url(#denial)" filter="url(#roughInk)" />
                </g>
                <ellipse cx="17" cy="258" rx="25" ry="22" fill="#2d2438" opacity=".88" filter="url(#roughInk)" />
                <path d="M19 247 C87 234 188 261 279 245" stroke="#3c304e" stroke-width="7" stroke-linecap="round" opacity=".34" filter="url(#roughInk)" />
                <text class="value-label" x="300" y="264">35%</text>
                <rect class="brush-hit" x="-20" y="221" width="365" height="64" />
              </g>

              <g class="bar" data-name="抑郁" data-value="37" data-left="548" data-top="520">
                <g transform="translate(0 376) scale(.49 1.27)">
                  <use href="#stroke-shape" fill="url(#depress)" filter="url(#roughInk)" />
                </g>
                <ellipse cx="17" cy="405" rx="25" ry="22" fill="#172a25" opacity=".9" filter="url(#roughInk)" />
                <path d="M28 391 C118 384 209 411 298 391" stroke="#28463d" stroke-width="7" stroke-linecap="round" opacity=".33" filter="url(#roughInk)" />
                <text class="value-label" x="318" y="411">37%</text>
                <rect class="brush-hit" x="-20" y="368" width="382" height="64" />
              </g>

              <g class="bar" data-name="焦虑" data-value="34" data-left="520" data-top="555">
                <g transform="translate(0 522) scale(.45 1.27)">
                  <use href="#stroke-shape" fill="url(#anxiety)" filter="url(#roughInk)" />
                </g>
                <ellipse cx="17" cy="551" rx="24" ry="22" fill="#8f251f" opacity=".9" filter="url(#roughInk)" />
                <path d="M28 538 C112 528 204 560 287 540" stroke="#9f342d" stroke-width="7" stroke-linecap="round" opacity=".35" filter="url(#roughInk)" />
                <text class="value-label" x="294" y="557">34%</text>
                <rect class="brush-hit" x="-20" y="514" width="355" height="64" />
              </g>
            </g>
          </svg>

          <output class="tooltip" id="chartTooltip" aria-live="polite">
            <span>自我否认</span>
            <span>35%</span>
          </output>
        </div>
      </section>
    </main>

    <script>
      const tooltip = document.querySelector("#chartTooltip");
      const bars = document.querySelectorAll(".bar");

      function focusBar(bar) {
        tooltip.classList.remove("is-hidden");
        tooltip.style.left = `${bar.dataset.left}px`;
        tooltip.style.top = `${bar.dataset.top}px`;
        tooltip.innerHTML = `<span>${bar.dataset.name}</span><span>${bar.dataset.value}%</span>`;
      }

      bars.forEach((bar) => {
        bar.addEventListener("pointerenter", () => focusBar(bar));
        bar.addEventListener("click", () => focusBar(bar));
      });
    </script>
  </body>
</html>
